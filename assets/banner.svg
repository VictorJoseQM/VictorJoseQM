<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Victor Jose - Full Stack Developer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F0FF"/>
      <stop offset="50%"  stop-color="#7B5CFF"/>
      <stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="115%" r="70%">
      <stop offset="0%"   stop-color="#7B5CFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#05070F" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-80%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1000" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="220" fill="#05070F"/>
    <rect width="1000" height="220" fill="url(#halo)"/>

    <text x="500" y="105" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
          font-size="58" font-weight="700" letter-spacing="4"
          fill="url(#neon)" filter="url(#glow)">VICTOR JOSÉ</text>

    <text x="500" y="142" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
          font-size="14" fill="#7F93B8" letter-spacing="7">FULL STACK DEVELOPER</text>

    <rect x="360" y="172" width="280" height="1.5" fill="url(#neon)" opacity="0.6"/>
    <rect x="360" y="170.5" width="70" height="4" rx="2" fill="#00F0FF" filter="url(#glow)">
      <animate attributeName="x" values="360;570;360" dur="6s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="999" height="219" rx="14" fill="none" stroke="#18263F" stroke-width="1.5"/>
  </g>
</svg>
