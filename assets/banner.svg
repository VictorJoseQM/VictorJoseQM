<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Victor Jose - Full Stack Developer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F0FF"/>
      <stop offset="45%"  stop-color="#7B5CFF"/>
      <stop offset="75%"  stop-color="#B14AFF"/>
      <stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0A0F1F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070F" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#12B5C9" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-40%" y="-80%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#05070F"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <ellipse cx="500" cy="330" rx="560" ry="150" fill="#B14AFF" opacity="0.16"/>
    <ellipse cx="500" cy="345" rx="360" ry="110" fill="#00F0FF" opacity="0.13"/>
    <rect width="1000" height="300" fill="url(#fade)"/>

    <rect x="0" y="0" width="1000" height="2" fill="url(#scan)">
      <animate attributeName="y" values="-4;300;-4" dur="7s" repeatCount="indefinite"/>
    </rect>

    <g stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.85" filter="url(#softglow)">
      <path d="M26 62 L26 26 L74 26"/>
      <path d="M974 62 L974 26 L926 26"/>
      <path d="M26 238 L26 274 L74 274"/>
      <path d="M974 238 L974 274 L926 274"/>
    </g>

    <text x="52" y="72" font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
          font-size="15" fill="#00F0FF" opacity="0.9" letter-spacing="2">
      &gt; system.boot --profile=victor_jose
    </text>
    <rect x="408" y="59" width="9" height="17" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>

    <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
       font-size="70" font-weight="700" letter-spacing="6" text-anchor="middle">
      <text x="500" y="172" fill="#FF2E97" opacity="0.55">VICTOR JOSÉ
        <animate attributeName="dx" values="0;-4;3;0;0;0;0;0" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.15;0.6;0.2;0.5" dur="4.2s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="172" fill="#00F0FF" opacity="0.55">VICTOR JOSÉ
        <animate attributeName="dx" values="0;4;-3;0;0;0;0;0" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.6;0.15;0.55;0.5" dur="4.2s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="172" fill="url(#neon)" filter="url(#glow)">VICTOR JOSÉ</text>
    </g>

    <text x="500" y="212" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
          font-size="17" fill="#9FB3D9" letter-spacing="5">FULL STACK DEVELOPER</text>
    <text x="500" y="240" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
          font-size="13" fill="#5C7099" letter-spacing="3">TYPESCRIPT · REACT NATIVE · NESTJS · POSTGRESQL · AWS</text>

    <rect x="150" y="268" width="700" height="2" fill="url(#neon)" opacity="0.7"/>
    <rect x="150" y="266" width="120" height="6" rx="3" fill="#00F0FF" filter="url(#softglow)" opacity="0.9">
      <animate attributeName="x" values="150;730;150" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#1B2A4A" stroke-width="1.5"/>
  </g>
</svg>
