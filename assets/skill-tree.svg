<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Skill tree">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#7B5CFF"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B5CFF"/><stop offset="100%" stop-color="#B14AFF"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B14AFF"/><stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="60%" stop-color="#B14AFF"/><stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#12B5C9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="gl" x="-50%" y="-150%" width="200%" height="400%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="468" rx="16" fill="#05070F" stroke="#1B2A4A" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="468" rx="16" fill="url(#grid2)"/>

  <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace">
    <text x="40" y="52" font-size="22" font-weight="700" fill="url(#hdr)" filter="url(#gl)" letter-spacing="4">◢ SKILL TREE</text>
    <text x="860" y="52" font-size="13" fill="#5C7099" text-anchor="end" letter-spacing="2">XP / 100</text>
    <rect x="40" y="68" width="820" height="1" fill="#1B2A4A"/>

    <!-- rows -->
    <g font-size="14" fill="#C6D4EE">
      <!-- 1 -->
      <text x="40" y="112">TypeScript</text>
      <text x="860" y="112" text-anchor="end" fill="#00F0FF" font-size="12">92</text>
      <rect x="330" y="102" width="480" height="10" rx="5" fill="#0E1730" stroke="#182647"/>
      <rect x="330" y="102" width="442" height="10" rx="5" fill="url(#g1)" filter="url(#gl)">
        <animate attributeName="width" from="0" to="442" dur="1.3s" begin="0.1s" fill="freeze"/>
      </rect>

      <!-- 2 -->
      <text x="40" y="164">React · React Native</text>
      <text x="860" y="164" text-anchor="end" fill="#00F0FF" font-size="12">90</text>
      <rect x="330" y="154" width="480" height="10" rx="5" fill="#0E1730" stroke="#182647"/>
      <rect x="330" y="154" width="432" height="10" rx="5" fill="url(#g1)" filter="url(#gl)">
        <animate attributeName="width" from="0" to="432" dur="1.3s" begin="0.25s" fill="freeze"/>
      </rect>

      <!-- 3 -->
      <text x="40" y="216">Node.js · NestJS</text>
      <text x="860" y="216" text-anchor="end" fill="#9B7BFF" font-size="12">88</text>
      <rect x="330" y="206" width="480" height="10" rx="5" fill="#0E1730" stroke="#182647"/>
      <rect x="330" y="206" width="422" height="10" rx="5" fill="url(#g2)" filter="url(#gl)">
        <animate attributeName="width" from="0" to="422" dur="1.3s" begin="0.4s" fill="freeze"/>
      </rect>

      <!-- 4 -->
      <text x="40" y="268">PostgreSQL · Prisma</text>
      <text x="860" y="268" text-anchor="end" fill="#9B7BFF" font-size="12">82</text>
      <rect x="330" y="258" width="480" height="10" rx="5" fill="#0E1730" stroke="#182647"/>
      <rect x="330" y="258" width="394" height="10" rx="5" fill="url(#g2)" filter="url(#gl)">
        <animate attributeName="width" from="0" to="394" dur="1.3s" begin="0.55s" fill="freeze"/>
      </rect>

      <!-- 5 -->
      <text x="40" y="320">Docker · AWS</text>
      <text x="860" y="320" text-anchor="end" fill="#FF2E97" font-size="12">72</text>
      <rect x="330" y="310" width="480" height="10" rx="5" fill="#0E1730" stroke="#182647"/>
      <rect x="330" y="310" width="346" height="10" rx="5" fill="url(#g3)" filter="url(#gl)">
        <animate attributeName="width" from="0" to="346" dur="1.3s" begin="0.7s" fill="freeze"/>
      </rect>

      <!-- 6 -->
      <text x="40" y="372">Java · Spring Boot</text>
      <text x="860" y="372" text-anchor="end" fill="#FF2E97" font-size="12">68</text>
      <rect x="330" y="362" width="480" height="10" rx="5" fill="#0E1730" stroke="#182647"/>
      <rect x="330" y="362" width="326" height="10" rx="5" fill="url(#g3)" filter="url(#gl)">
        <animate attributeName="width" from="0" to="326" dur="1.3s" begin="0.85s" fill="freeze"/>
      </rect>
    </g>

    <rect x="40" y="404" width="820" height="1" fill="#1B2A4A"/>
    <text x="40" y="437" font-size="12" fill="#5C7099" letter-spacing="1">PASSIVE ▸ Clean Architecture · SOLID · TDD · Code Review</text>
    <circle cx="843" cy="433" r="4" fill="#2BE38A">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="830" y="437" font-size="12" fill="#2BE38A" text-anchor="end" letter-spacing="1">LEARNING</text>
  </g>
</svg>
