<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#B14AFF" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#FF2E97" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="5" width="1000" height="2" fill="url(#d)" filter="url(#dg)"/>
  <rect x="0" y="4" width="90" height="4" rx="2" fill="#00F0FF" filter="url(#dg)" opacity="0.95">
    <animate attributeName="x" values="60;850;60" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
