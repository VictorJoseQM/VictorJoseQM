name: Generate snake animation

on:
  schedule: # executa a cada 12 horas
    - cron: "0 */12 * * *"

  # permite rodar manualmente na aba Actions
  workflow_dispatch:

  # roda a cada push na branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Gera o arquivo snake.svg
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Gera apenas a versão dark (que combina com seu perfil)
          outputs: dist/snake.svg?palette=github-dark

      # Envia para a branch 'output'
      - name: push snake.svg to the output branch
        uses: crazy-max/gh-action-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
