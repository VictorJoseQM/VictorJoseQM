name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#B14AFF&color_dots=#E6EDF3,#9BD9FF,#4AC8FF,#7B5CFF,#B14AFF
            dist/snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#0E1730,#164A5C,#12B5C9,#7B5CFF,#FF2E97

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
